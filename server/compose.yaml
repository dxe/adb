name: dxe-adb

services:
  mysql:
    # Keep version in sync with:
    # * server/src/testdb/mysql_container.go
    # * .github/workflows/main.yml
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: localdev
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocaldev", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mysql-data: {}
