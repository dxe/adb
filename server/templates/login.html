{{template "header.html" .}}
<meta name="google-signin-client_id" content="975059814880-lfffftbpt7fdl14cevtve8sjvh015udc.apps.googleusercontent.com">
<script src="https://apis.google.com/js/platform.js" onerror="onScriptLoadError()" async defer></script>

<div class="body-wrapper">
  <p id="login-text">Please log in.</p>
  <div id="message"></div>
  <div class="g-signin2" data-onsuccess="onSignIn"></div>
  <script>
    function setText(id, text) {
      document.getElementById(id).textContent = text;
    }
    function onScriptLoadError() {
      setText('login-text', "The Google login API failed to load. If you are using an ad blocker, please disable it and refresh this page. If it still fails to load, please contact tech@dxe.io.");
    }
    function onSignIn(googleUser) {
      var id_token = googleUser.getAuthResponse().id_token;
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/tokensignin');
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.onload = function() {
        if (xhr.status !== 200) {
          setText('message', "Error status code from server: " + xhr.status);
          return;
        }

        try {
          var data = JSON.parse(xhr.responseText);
        } catch(err) {
          setText('message', "Could not parse message from server: " + xhr.responseText);
          return;
        }

        if (data['redirect']) {
          // Redirect to index
          window.location = "/";
          return;
        } else {
          // Print the message if it exists
          if (data['message']) {
            setText('message', data['message']);
          } else {
            setText('message', "Server could not authenticate you for some reason");
          }
        }
      };
      xhr.send('idtoken=' + id_token);
    }
  </script>
</div>

{{template "footer.html" .}}
